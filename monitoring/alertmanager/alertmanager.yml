global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'provider', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'slack-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'slack-notifications'
      continue: true

receivers:
  - name: 'slack-notifications'
    webhook_configs:
      - url: 'http://app:8000/api/alerts/test-notification'
        send_resolved: true
    # For actual production Slack webhook integration:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#devops-cloud-alerts'
    #     title: '{{ template "slack.default.title" . }}'
    #     text: '{{ template "slack.default.text" . }}'
