version: '3.8'

services:
  # 1. Main Dashboard Application (FastAPI Backend + Frontend SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-cost-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/devops_cost_db
      - ALERTMANAGER_URL=http://alertmanager:9093
      - MOCK_CLOUD_MODE=true
      - SYNC_INTERVAL_HOURS=24
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops-network

  # 2. Relational Database (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: devops-cost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_cost_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_cost_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops-network

  # 3. Prometheus Metrics Scraper & Evaluation
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: devops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - devops-network

  # 4. Prometheus Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: devops-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - devops-network

  # 5. Grafana Analytics & Pre-Configured Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: devops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
